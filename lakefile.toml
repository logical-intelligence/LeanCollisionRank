name = "symmetric_collision_rank"
version = "1.0.0"
defaultTargets = ["main", "proofs.verification.Audit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "d03acab154d269c06e60e4de7e4cc85deebff94b"

[[require]]
name = "lean4export"
git = "https://github.com/leanprover/lean4export.git"
rev = "076e8e57707e813375e8f9da8bf989799ace9680"

[[lean_lib]]
name = "CollisionRank"
srcDir = "proofs"

[[lean_lib]]
name = "Specification"
roots = ["main", "axioms", "definitions"]

[[lean_lib]]
name = "Verification"
roots = ["proofs.verification.Audit"]
