name = "symmetric_collision_rank"
version = "1.0.0"
defaultTargets = ["main", "proofs.verification.Audit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "07bc4ea40f2266dcb861820a2ec1fa3244ed307f"

[[require]]
name = "lean4export"
git = "https://github.com/leanprover/lean4export.git"
rev = "4e7915201d3f9f04470d9eae002fa695f7cdc589"

[[lean_lib]]
name = "CollisionRank"
srcDir = "proofs"

[[lean_lib]]
name = "Specification"
roots = ["main", "axioms", "definitions"]

[[lean_lib]]
name = "Verification"
roots = ["proofs.verification.Audit"]
